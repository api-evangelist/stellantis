aid: stellantis
name: Stellantis
description: 'Stellantis is the automotive group formed in 2021 by the merger of PSA Group and FCA, owning Abarth, Alfa Romeo, Chrysler, Citroen, Dodge, DS, Fiat, Jeep, Lancia, Maserati, Opel, Peugeot, Ram and Vauxhall. It publishes connected-vehicle developer APIs: the Stellantis Connected Vehicle API on developers.stellantis.com, the Connected Car B2C and B2B web APIs (inherited from Groupe PSA) documented at developer.groupe-psa.io, and Stellantis Cloud Capability API specifications published in its GitHub organization.'
